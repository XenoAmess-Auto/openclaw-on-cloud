name: Dependabot auto-merge

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  pull-requests: write
  contents: write

jobs:
  dependabot:
    if: |
      github.event.pull_request.user.login == 'dependabot[bot]' ||
      github.event.pull_request.user.login == 'app/dependabot'
    runs-on: ubuntu-latest
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Check if auto-merge applicable
        id: check
        run: |
          TYPE="${{ steps.metadata.outputs.update-type }}"
          REF="${{ github.event.pull_request.head.ref }}"
          echo "Update type: $TYPE"
          echo "Head ref: $REF"

          if [[ "$TYPE" == "version-update:semver-patch" ]] || \
             [[ "$TYPE" == "version-update:semver-minor" ]]; then
            echo "should_merge=true" >> "$GITHUB_OUTPUT"
            echo "Patch or minor update. Will auto-merge after CI passes."
          elif [[ "$TYPE" == "version-update:semver-major" ]] && \
               [[ "$REF" == dependabot/github_actions/* ]]; then
            echo "should_merge=true" >> "$GITHUB_OUTPUT"
            echo "Major github-actions update. Will auto-merge after CI passes."
          else
            echo "should_merge=false" >> "$GITHUB_OUTPUT"
            echo "Major non-github-actions (or unknown) update. Skipping auto-merge."
          fi

      - name: Approve dependabot PR
        if: steps.check.outputs.should_merge == 'true'
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.MYTOKEN }}

      - name: Enable auto-merge
        if: steps.check.outputs.should_merge == 'true'
        run: gh pr merge --auto --rebase "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.MYTOKEN }}
